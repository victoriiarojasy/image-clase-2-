<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="leverMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="leverShaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="leverKnobOff" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="leverKnobOn" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <filter id="leverShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Wall/Stand Mount Base Box -->
  <g filter="url(#leverShadow)">
    <rect x="25" y="100" width="150" height="200" rx="16" fill="url(#leverMetal)" stroke="#0f172a" stroke-width="4"/>
    
    <!-- Inner face plate -->
    <rect x="40" y="115" width="120" height="170" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- Bolts on corners -->
    <circle cx="36" cy="112" r="5" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="164" cy="112" r="5" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="36" cy="288" r="5" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="164" cy="288" r="5" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Warning hazard stripes at top and bottom of box -->
    <g opacity="0.8">
      <path d="M 40,115 L 55,115 L 40,130 Z" fill="#fbbf24"/>
      <path d="M 65,115 L 80,115 L 45,150 L 40,150 L 40,140 Z" fill="#fbbf24"/>
      <path d="M 90,115 L 105,115 L 45,175 L 40,175 L 40,165 Z" fill="#fbbf24"/>
    </g>

    <!-- Slot track for lever vertical pull -->
    <rect x="86" y="140" width="28" height="120" rx="14" fill="#020617" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Status Text & LEDs -->
    <rect x="55" y="240" width="90" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="100" y="260" font-family="'Inter', sans-serif" font-weight="900" font-size="13" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
      ACTIVAR
    </text>

    <!-- Pivot mount collar -->
    <circle cx="100" cy="230" r="18" fill="url(#leverShaft)" stroke="#0f172a" stroke-width="2"/>
    <circle cx="100" cy="230" r="9" fill="#1e293b"/>
  </g>

  <!-- Lever Arm (default UP state) -->
  <g id="leverArm" transform="translate(100, 230) rotate(-40)">
    <!-- Shaft -->
    <rect x="-9" y="-140" width="18" height="140" rx="9" fill="url(#leverShaft)" stroke="#334155" stroke-width="1.5" filter="url(#leverShadow)"/>
    <!-- Red Knob Handle -->
    <circle cx="0" cy="-145" r="26" fill="url(#leverKnobOff)" stroke="#991b1b" stroke-width="2.5" filter="url(#leverShadow)"/>
    <ellipse cx="-7" cy="-152" rx="8" ry="5" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
