<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Projector Lens Icon on Left -->
  <g transform="translate(40, 30)">
    <!-- Base stand -->
    <path d="M 50,130 L 70,130 L 65,80 L 55,80 Z" fill="#475569"/>
    <!-- Projector body -->
    <rect x="20" y="35" width="80" height="46" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="85" cy="58" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="3" filter="url(#logoGlow)"/>
    <circle cx="85" cy="58" r="8" fill="#e0f2fe"/>
    
    <!-- Light beam cone -->
    <polygon points="100,58 200,10 200,110" fill="url(#beamGrad)" />
    
    <!-- Optical prism rings in beam -->
    <ellipse cx="150" cy="58" rx="12" ry="28" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <ellipse cx="180" cy="58" rx="16" ry="42" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Typography -->
  <text x="240" y="90" font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="52" fill="url(#logoGrad)" letter-spacing="4" filter="url(#logoGlow)">
    PROYECCIONES
  </text>
  <text x="245" y="145" font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="44" fill="#0f172a" letter-spacing="6">
    IMAGE
  </text>
  
  <!-- Optical badge -->
  <rect x="440" y="112" width="160" height="34" rx="17" fill="#0ea5e9" opacity="0.15"/>
  <rect x="440" y="112" width="160" height="34" rx="17" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="520" y="134" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#0284c7" text-anchor="middle" letter-spacing="2">
    OPTICAL LAB
  </text>

  <!-- Decorative sparkles -->
  <polygon points="215,35 220,45 230,50 220,55 215,65 210,55 200,50 210,45" fill="#38bdf8"/>
  <polygon points="695,75 698,82 705,85 698,88 695,95 692,88 685,85 692,82" fill="#ec4899"/>
</svg>
